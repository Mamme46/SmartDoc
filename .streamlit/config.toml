[theme]
# Sans ce bloc, Streamlit suit le thème clair/sombre du navigateur du client :
# les champs de saisie (text_input, etc.) passaient en noir chez les clients
# en dark mode alors que le reste de l'UI (CSS custom ci-dessous) reste clair.
# On fige donc un thème clair explicite, cohérent avec les couleurs custom.
base = "light"
primaryColor = "#6C5CE7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FC"
textColor = "#1F2430"

[client]
# Sans ça, toute exception non interceptée (bug de code, clé de widget en
# double, erreur du moteur IA...) affiche dans le navigateur le message
# d'erreur complet ET la stack trace avec des extraits du code source.
# "none" : le visiteur ne voit qu'un message générique ; le détail complet
# continue d'atterrir dans les logs du conteneur (docker logs) pour debug.
showErrorDetails = "none"

[server]
# ai/.venv est physiquement dans le dossier du projet : sans cette exclusion,
# Streamlit essaie de surveiller (pour le rechargement à chaud) chaque
# sous-module de torch/transformers, y compris ceux en import paresseux qui
# lèvent des erreurs silencieuses mais coûteuses à chaque tentative.
# Ça peut ajouter plusieurs dizaines de secondes au premier chargement.
folderWatchBlacklist = ["ai/.venv"]
fileWatcherType = "none"
