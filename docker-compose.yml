services:

  ollama:
    image: ollama/ollama:0.13.5
    container_name: smartdoc-ollama

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s 
      retries: 10
      start_period: 10s


  ollama-init:
    image: ollama/ollama:0.13.5
    container_name: smartdoc-ollama-init

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434

    volumes:
      - ollama_data:/root/.ollama

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull qwen2.5:3b


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smartdoc-app

    environment:
      OLLAMA_HOST: http://ollama:11434

      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface

    volumes:
      # Ces montages restent sur l'hôte quand le conteneur est supprimé.
      # Ne pas les remplacer par des volumes éphémères ni supprimer ces dossiers.
      - ./smartdoc.db:/app/smartdoc.db

      # Documents utilisateurs persistants
      - ./app/data:/app/app/data

      # Cache du modèle Hugging Face
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped


  session-cookie:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["python", "app/auth/cookie_server.py"]

    environment:
      SMARTDOC_DB_PATH: /app/smartdoc.db
      SMARTDOC_COOKIE_SECURE: ${SMARTDOC_COOKIE_SECURE:-false}

    volumes:
      - ./smartdoc.db:/app/smartdoc.db

    depends_on:
      app:
        condition: service_started

    restart: unless-stopped


  proxy:
    image: nginx:alpine

    ports:
      - "127.0.0.1:8501:8501"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_started
      session-cookie:
        condition: service_started

    restart: unless-stopped


volumes:
  ollama_data:
  huggingface_cache: